name: BeerDebt
options:
  bundleIdPrefix: me.colinwatson
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
settings:
  SWIFT_VERSION: "6.0"
  SWIFT_APPROACHABLE_CONCURRENCY: YES
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  BeerDebt:
    type: application
    platform: iOS
    sources:
      - path: BeerDebt
      - path: BeerDebtWidget/BalanceWidgetViews.swift   # shared with the widget for the DEBUG widget preview screen
    settings:
      INFOPLIST_FILE: BeerDebt/Resources/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: me.colinwatson.beerdebt
      DEVELOPMENT_TEAM: M7PCWQ7WYN
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: BeerDebt/Resources/BeerDebt.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: BeerDebtWidget
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - BeerDebtTests
  BeerDebtWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BeerDebtWidget
      - path: BeerDebt/Engine
      - path: BeerDebt/Models
      - path: BeerDebt/Theme/Format.swift
      - path: BeerDebt/Theme/Theme.swift
    settings:
      INFOPLIST_FILE: BeerDebtWidget/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: me.colinwatson.beerdebt.widget
      DEVELOPMENT_TEAM: M7PCWQ7WYN
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: BeerDebtWidget/BeerDebtWidget.entitlements
      SKIP_INSTALL: YES
      TARGETED_DEVICE_FAMILY: "1"
  BeerDebtTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BeerDebtTests
    dependencies:
      - target: BeerDebt
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: me.colinwatson.beerdebt.tests
      DEVELOPMENT_TEAM: M7PCWQ7WYN
      GENERATE_INFOPLIST_FILE: YES

# No third-party dependencies. The app is SwiftUI + HealthKit + Foundation only;
# the balance engine is pure Swift so it can be unit-tested and ported to Android.
